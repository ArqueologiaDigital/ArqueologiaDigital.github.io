<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Arqueologia Digital</title>
<script>
// The Telegram chat log moved from /Telegram_logs/ (repo now private) to /Telegram_logs_site/,
// with the same file names. GitHub Pages serves this page for every path on the domain that no
// project repo serves, so old links land here and are sent on to the new address.
(function () {
  var p = location.pathname, old = "/Telegram_logs/";
  if (p.indexOf(old) === 0 || p === "/Telegram_logs") {
    location.replace("/Telegram_logs_site/" + p.slice(old.length) + location.search + location.hash);
    return;
  }
  // /topicos/, /comunidade/, /projetos/, /logs/ and /busca/ are real pages of this repository
  // (written by Telegram_logs_site/publish.sh). /log is kept as another name for /logs/.
  if (p.toLowerCase().replace(/\/$/, "") === "/log") location.replace("/logs/" + location.hash);
  // Cross-year topics that were split or renamed: old slug -> new slug.
  var moved = { "vet3000-brick-games": "vet3000" };   // 2026-11-12: split into vet3000 and brick-games
  var m = p.match(/^\/topicos\/([^\/]+)\/?$/);
  if (m && moved[m[1]]) location.replace("/topicos/" + moved[m[1]] + "/" + location.hash);
})();
</script>
</head>
<body>
<h3>Página não encontrada</h3>
<p><a href="/">Arqueologia Digital</a> &middot;
<a href="/logs/">Log do Chat no Canal do Telegram</a> &middot;
<a href="/busca/">Busca</a> &middot;
<a href="/topicos/">Tópicos</a> &middot;
<a href="/comunidade/">Comunidade</a> &middot;
<a href="/galeria.html">Galeria de fotos</a></p>
</body>
</html>
