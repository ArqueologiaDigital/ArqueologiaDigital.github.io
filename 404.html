<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Arqueologia Digital</title>
<script>
// The Telegram chat log moved from /Telegram_logs/ (repo now private) to /Telegram_logs_site/,
// with the same file names. GitHub Pages serves this page for every path on the domain that no
// project repo serves, so old links land here and are sent on to the new address.
(function () {
  var p = location.pathname, old = "/Telegram_logs/";
  if (p.indexOf(old) === 0 || p === "/Telegram_logs") {
    location.replace("/Telegram_logs_site/" + p.slice(old.length) + location.search + location.hash);
    return;
  }
  // Short addresses for pages of the chat log site, which live under
  // /Telegram_logs_site/formatted/html/. With or without ".html"; query and #anchor are kept.
  //   /comunidade  /topicos  /topicos-ano-3  /topico-patinho-feio  /membro-64762480
  //   /busca (search, e.g. /busca?q=patinho)  /log (index of the chat pages)
  var site = "/Telegram_logs_site/formatted/html/";
  var alias = { busca: "search", log: "index" };
  var m = /^\/([a-z0-9-]+)(?:\.html)?\/?$/.exec(p);
  if (m) {
    var name = alias[m[1]] || m[1];
    if (/^(comunidade|topicos|topicos-ano-\d+|topico-[a-z0-9-]+|membro-\d+|search|index)$/.test(name) && m[1] !== "index") {
      location.replace(site + name + ".html" + location.search + location.hash);
    }
  }
})();
</script>
</head>
<body>
<h3>Página não encontrada</h3>
<p><a href="/">Arqueologia Digital</a> &middot;
<a href="/Telegram_logs_site/formatted/html/index.html">Log do Chat no Canal do Telegram</a> &middot;
<a href="/Telegram_logs_site/formatted/html/topicos.html">Tópicos</a> &middot;
<a href="/Telegram_logs_site/formatted/html/comunidade.html">Comunidade</a></p>
</body>
</html>
